[project]
name = "wacc-toolkit"
version = "0.1.0"
description = "Atualizador e repositório versionado das bases de dados para cálculo de WACC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
wacc = "wacc_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wacc_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "online: testes que acessam a internet (rodar com -m online)",
    "excel: testes que recalculam via Excel (COM); pulados se o Excel não estiver disponível",
]
addopts = "-m 'not online'"
